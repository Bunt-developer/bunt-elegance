  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="collection">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header" class="site-header"></header>
  <main id="main">
    <section class="page-intro">
      <div class="container">
        <span class="eyebrow">Collection</span>
        <h1 class="h1" id="coll-title">The Collection</h1>
        <p class="body-lg" id="coll-line" style="max-width:40rem"></p>
      </div>
    </section>
    <div class="toolbar">
      <div class="container toolbar__inner">
        <div class="chips" id="cat-chips" role="group" aria-label="Filter by medium"></div>
        <button class="filter-btn" id="filter-toggle" aria-expanded="false" aria-controls="filter-panel"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Filter <span id="filter-count"></span></button>
      </div>
    </div>
    <div class="container">
      <div class="filter-panel" id="filter-panel" hidden>
        <div><h3>Space</h3><div class="opts" id="f-room"></div></div>
        <div><h3>Price</h3><div class="opts" id="f-price"></div></div>
        <div><h3>Availability</h3><div class="opts" id="f-avail"></div></div>
        <div><h3>Collection</h3><div class="opts" id="f-coll"></div></div>
        <div style="grid-column:1/-1;display:flex;gap:24px;align-items:center;flex-wrap:wrap">
          <div class="field" style="flex:1;min-width:220px"><label for="collection-q">Search within results</label><input id="collection-q" type="search" placeholder="Name, material, palette…"></div>
          <button class="link" id="clear-filters">Clear all filters</button>
        </div>
      </div>
      <div class="results-bar">
        <span id="results-count" aria-live="polite"></span>
        <label><span class="sr-only">Sort by</span>
          <select id="sort">
            <option value="featured">Sort: Curated</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="name">Name: A–Z</option>
          </select>
        </label>
      </div>
      <div class="product-grid" id="product-grid"></div>
      <noscript><p>Please enable JavaScript to browse and filter the collection, or <a href="contact.html">contact us</a>.</p></noscript>
    </div>
    <section class="section">
      <div class="container">
        <div class="section-head section-head--split">
          <div><span class="eyebrow">Browse by medium</span><h2 class="h2" style="margin-top:22px">Signature <em class="italic">collections</em></h2></div>
          <p class="body-lg">Twelve mediums explored with the same restraint and precision. Mediums without works currently listed are available by private commission.</p>
        </div>
        <div class="medium-grid" id="medium-grid"></div>
      </div>
    </section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
