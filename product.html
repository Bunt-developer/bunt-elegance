<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="description" content="A handcrafted statement artwork by BUNT ELEGANCE — story, materials, dimensions, edition and Certificate of Authenticity.">

  <meta name="theme-color" content="#1a1816">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BUNT ELEGANCE">
  <meta property="og:title" content="Artwork | BUNT ELEGANCE">
  <meta property="og:description" content="A handcrafted statement artwork by BUNT ELEGANCE — story, materials, dimensions, edition and Certificate of Authenticity.">
  <meta property="og:image" content="assets/img/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="product">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header" class="site-header"></header>
  <main id="main">
    <div class="pdp container" id="pdp"></div>
    <section class="section">
      <div class="container">
        <div class="section-head section-head--split">
          <div><span class="eyebrow">You may also consider</span><h2 class="h2" style="margin-top:22px">From the <em class="italic">collection</em></h2></div>
          <a class="link" href="collection.html" style="justify-self:start">View all works <svg class="arrow" viewBox="0 0 22 10" fill="none" stroke="currentColor" stroke-width="1"><path d="M0 5h21M16.5 .5 21 5l-4.5 4.5"/></svg></a>
        </div>
        <div class="product-grid" id="related"></div>
      </div>
    </section>
    <div class="sticky-buy" id="sticky-buy"></div>
    <div class="modal" id="vii" role="dialog" aria-modal="true" aria-labelledby="vii-title">
      <div class="modal__backdrop" data-close></div>
      <div class="modal__box modal__box--wide">
        <button class="close-btn modal__close" data-close aria-label="Close" style="color:var(--ivory)"><svg viewBox="0 0 24 24" fill="none"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
        <div class="vii">
          <div class="vii__stage"><img class="room" alt=""><div class="vii__art"></div></div>
          <div class="vii__panel">
            <span class="eyebrow light">View in interior</span>
            <h3 id="vii-title" data-vii-name>Artwork</h3>
            <p class="muted" data-vii-size></p>
            <div><p class="caps" style="margin-bottom:12px;color:var(--mist)">Choose a room</p><div class="opts" id="vii-rooms" style="display:flex;flex-wrap:wrap;gap:8px"></div></div>
            <div><label class="caps" for="vii-scale" style="color:var(--mist)">Adjust scale</label><input id="vii-scale" type="range" min="0.6" max="1.4" step="0.05" value="1"></div>
            <p class="muted">Drag the artwork to reposition it. Scale is approximate — for exact placement, send us a photo of your wall and we will prepare a proportional preview.</p>
            <button class="btn btn--light" data-close data-open="enquire">Request a wall preview</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
